<svg xmlns="http://www.w3.org/2000/svg" width="520" height="680" viewBox="0 0 520 680"><rect width="520" height="680" fill="#e8dfc9"/><g fill="#51594f" font-family="serif" font-size="23" font-style="italic"><text x="47" y="76">Dimanche,</text><text x="47" y="140">Il pleut encore ici.</text><text x="47" y="183">J’ai presque terminé le morceau</text><text x="47" y="219">que je t’avais promis.</text><text x="47" y="285">Tu pourrais venir l’écouter.</text><text x="47" y="328">Le piano sonne un peu faux,</text><text x="47" y="364">mais il y a de la place pour deux.</text><text x="47" y="433">Cette fois, je</text></g><path d="M46 542h429" stroke="#c5b798"/></svg>
